<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Body Pro & Fok Koç</title>
  <style>
    :root {
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent: #ff4757;
      --bg: #0a0a0c;
      --card-bg: rgba(22, 24, 30, 0.95);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background: var(--bg); 
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08), transparent 70%);
      color: #fff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 15px; 
      overflow-x: hidden;
    }

    .card { 
      background: var(--card-bg); 
      border-radius: 24px; 
      padding: 28px 24px; 
      width: 100%; 
      max-width: 420px; 
      text-align: center; 
      box-shadow: 0 20px 50px rgba(0,0,0,0.9), 0 0 20px rgba(0, 242, 254, 0.1); 
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      position: relative;
      z-index: 2;
    }
    
    h1 { 
      margin-top: 0; 
      background: linear-gradient(135deg, var(--secondary), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 26px; 
      margin-bottom: 4px; 
      font-weight: 900; 
      letter-spacing: -0.5px;
    }
    .subtitle { font-size: 12px; color: #666; margin-bottom: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
    
    .status { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; font-weight: 800; color: #888; }
    .set-badge { display: inline-block; background: rgba(0, 242, 254, 0.12); color: var(--primary); padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 800; margin-bottom: 15px; border: 1px solid rgba(0, 242, 254, 0.25); }
    .exercise-name { font-size: 22px; font-weight: 800; margin-bottom: 12px; color: #fff; letter-spacing: -0.5px; }
    
    /* Detay Kartı */
    .info-box { background: rgba(255,255,255,0.03); border-radius: 14px; padding: 14px; margin-bottom: 18px; text-align: left; border: 1px solid rgba(255,255,255,0.06); }
    .info-target { font-size: 12px; font-weight: 800; color: var(--primary); margin-bottom: 4px; text-transform: uppercase; }
    .info-detail { font-size: 13px; color: #bbb; line-height: 1.4; margin-bottom: 8px; }
    .info-reps { font-size: 13px; font-weight: 700; color: #2ed573; background: rgba(46, 213, 115, 0.1); padding: 4px 8px; border-radius: 6px; display: inline-block; }

    /* Rep Input */
    .rep-tracker { display: none; margin-bottom: 18px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; }
    .rep-tracker label { font-size: 13px; color: #aaa; margin-right: 10px; font-weight: 600; }
    .rep-tracker input { width: 70px; background: #222; border: 1px solid #444; color: #fff; padding: 6px 10px; border-radius: 8px; font-size: 16px; text-align: center; font-weight: bold; }

    /* Dairesel Sayaç */
    .ring-container { position: relative; width: 140px; height: 140px; margin: 0 auto 20px auto; }
    .progress-ring__circle { transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%; }
    .timer-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 34px; font-weight: 900; color: #fff; letter-spacing: -1px; }

    /* Buton */
    .btn { 
      background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%); 
      color: #000; 
      border: none; 
      padding: 16px 28px; 
      font-size: 16px; 
      font-weight: 900; 
      border-radius: 14px; 
      cursor: pointer; 
      width: 100%; 
      transition: all 0.2s; 
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.3); 
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .progress { margin-top: 15px; font-size: 12px; color: #555; font-weight: 700; text-transform: uppercase; }

    /* --- SAĞDAKİ MOTİVASYON FOK BALIĞI --- */
    .seal-widget {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 99;
      max-width: 200px;
      pointer-events: none;
    }
    .seal-speech {
      background: #ffffff;
      color: #121212;
      padding: 10px 14px;
      border-radius: 16px;
      border-bottom-right-radius: 2px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      margin-bottom: 8px;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      line-height: 1.3;
      text-align: right;
    }
    .seal-avatar {
      font-size: 42px;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
      animation: float 3s ease-in-out infinite;
      cursor: pointer;
      pointer-events: auto;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(5deg); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.5) translateY(10px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @media (max-width: 600px) {
      .seal-widget { right: 10px; bottom: 10px; max-width: 150px; }
      .seal-speech { font-size: 11px; padding: 8px 10px; }
      .seal-avatar { font-size: 36px; }
    }
  </style>
</head>
<body>

<div class="card">
  <h1>FULL BODY PRO</h1>
  <div class="subtitle">1 Aylık Calisthenics Programı</div>

  <div class="status" id="status-text">ANTRENMANA HAZIRLAN</div>
  <div class="set-badge" id="set-badge" style="display:none;"></div>
  
  <div class="exercise-name" id="exercise-name">Başlamaya Hazır Mısın?</div>

  <div class="info-box" id="info-box" style="display:none;">
    <div class="info-target" id="info-target">HEDEF KASLAR</div>
    <div class="info-detail" id="info-detail">Açıklama</div>
    <div class="info-reps" id="info-reps">🎯 Hedef: 0 Tekrar</div>
  </div>

  <div class="rep-tracker" id="rep-tracker">
    <label for="rep-input">Bu sette kaç tekrar yaptın?</label>
    <input type="number" id="rep-input" placeholder="0" min="0">
  </div>

  <div class="ring-container" id="ring-container">
    <svg class="progress-ring" width="140" height="140">
      <circle stroke="#1e2026" stroke-width="8" fill="transparent" r="60" cx="70" cy="70"/>
      <circle id="ring-path" class="progress-ring__circle" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" fill="transparent" r="60" cx="70" cy="70"/>
    </svg>
    <div class="timer-display" id="timer">00:00</div>
  </div>

  <button class="btn" id="action-btn" onclick="nextStep()">ANTRENMANA BAŞLA</button>
  <div class="progress" id="progress-text">0 / 5 Egzersiz</div>
</div>

<!-- SAĞ TARAFTAKİ MOTİVASYON FOK BALIĞI KOÇU -->
<div class="seal-widget">
  <div class="seal-speech" id="seal-speech">Arf! Arf! Bugün kasları patlatma günü şampiyon! 🦭</div>
  <div class="seal-avatar" onclick="triggerSealQuote()">🦭</div>
</div>

<script>
  // Barfiks yerine Y-T-W / Superman eklendi, Tahmini Şınav/Tekrar sayıları güncellendi.
  const workout = [
    { 
      name: "1. Pike Push-Up", 
      type: "reps", 
      sets: 3, 
      target: "Omuzlar & Üst Göğüs",
      detail: "Kalçanı yukarı kaldır 'V' ol. Başını ellerinin biraz önüne indirip omuz gücünle kendini geriye it.", 
      targetReps: "8 - 12 Tekrar",
      setRest: 90, 
      exRest: 120 
    },
    { 
      name: "2. Prone Y-T-W / Superman", 
      type: "reps", 
      sets: 3, 
      target: "Tüm Sırt, Arka Omuz & Duruş Kasları",
      detail: "Yüzüstü yat. Kolları sırasıyla Y, T ve W yapıp havaya kaldır. Kürek kemiklerini 2 saniye sık.", 
      targetReps: "12 - 15 Kombinasyon",
      setRest: 90, 
      exRest: 120 
    },
    { 
      name: "3. Standart Şınav", 
      type: "reps", 
      sets: 4, 
      target: "Göğüs, Ön Omuz & Triceps (Arka Kol)",
      detail: "Vücut ok gibi dümdüz. Göğüs yere değene kadar yavaş in, patlayıcı şekilde yukarı kendini it.", 
      targetReps: "15 - 20 Şınav (Tükeniş)",
      setRest: 90, 
      exRest: 120 
    },
    { 
      name: "4. Bulgarian Split Squat", 
      type: "reps", 
      sets: 3, 
      target: "Ön Bacak, Kalça & Arka Bacak",
      detail: "Bir ayağını arkadaki koltuğa koy. Öndeki bacağın üzerine 90 derece çök. Her bacak için ayrı ayrı yap.", 
      targetReps: "10 - 12 Tekrar (Her Bacak)",
      setRest: 90, 
      exRest: 120 
    },
    { 
      name: "5. Hollow Body Hold (Plank)", 
      type: "time", 
      duration: 60, 
      sets: 3, 
      target: "Tüm Karın Kasları & Core Bölgesi",
      detail: "Sırtüstü yat, belini yere yapıştır. Kolları ve bacakları kaldırarak karın kaslarını sıkarak sabit bekle.", 
      targetReps: "60 Saniye Sabit",
      setRest: 60, 
      exRest: 0 
    }
  ];

  // 1000+ Kombinasyonlu Dinamik Motivasyon Sözü Üreteci (Fok Balığı Algoritması)
  const sealWords = {
    openings: ["Arf! Arf! ", "Bip Bip! ", "Harika gidiyorsun! ", "Ooo şampiyon! ", "Gözlerindeki ateşi görüyorum! ", "Omuzlar alev aldı! ", "Odaklan! ", "Pes etmek yok! ", "Bırakma! ", "Kaslar büyüyor! "],
    actions: ["Bu sette ", "Son tekrarda ", "Şınav çekerken ", "Dinlenirken bile ", "Her harekette ", "Ter dökerken ", "Kasları zorlarken ", "Sınırları zorlarken "],
    complements: ["dev gibi oluyorsun! 🦭", "vücudun şekil alıyor!", "formun mükemmel görünüyor!", "acıyı hissediyorsan gelişim başladı demektir!", "disiplinin harika!", "1 ay sonraki haline kendin bile inanamayacaksın!", "tam bir canavara dönüşüyorsun!", "0 bahaneyle devam ediyorsun!"],
    extraQuotes: [
      "Şu an yoruluyorsun ama yarın daha güçlü uyanacaksın!",
      "Son 3 tekrarı yapmayanlar sıradan kalır, sen şampiyonsun!",
      "Fok balıkları bile senin bu azmine hayran kaldı!",
      "1 ay boyunca bu disiplini korursan aynalar sana yetmeyecek!",
      "Hadi bir set daha, pump hissini yakala!",
      "Ter damlaları başarının imzasıdır şampiyon!",
      "Sadece 5 egzersiz ama etkisi devasa!"
    ]
  };

  function generateSealQuote() {
    if (Math.random() > 0.4) {
      const o = sealWords.openings[Math.floor(Math.random() * sealWords.openings.length)];
      const a = sealWords.actions[Math.floor(Math.random() * sealWords.actions.length)];
      const c = sealWords.complements[Math.floor(Math.random() * sealWords.complements.length)];
      return o + a + c;
    } else {
      return sealWords.extraQuotes[Math.floor(Math.random() * sealWords.extraQuotes.length)];
    }
  }

  function triggerSealQuote() {
    const el = document.getElementById("seal-speech");
    el.style.animation = 'none';
    el.offsetHeight; // reflow
    el.style.animation = 'popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
    el.innerText = generateSealQuote();
  }

  // Otomatik Her 8 Saniyede Bir Söz Değiştir
  setInterval(triggerSealQuote, 8000);

  // ZAMANLAYICI VE MANTIKSAL KODLAR
  let currentIndex = -1;
  let currentSet = 1;
  let isResting = false;
  let isTimeRunning = false;
  let timerInterval = null;
  let secondsLeft = 0;
  let totalSeconds = 0;

  const ring = document.getElementById('ring-path');
  const radius = ring.r.baseVal.value;
  const circumference = radius * 2 * Math.PI;
  ring.style.strokeDasharray = `${circumference} ${circumference}`;
  ring.style.strokeDashoffset = circumference;

  function setRingProgress(percent) {
    const offset = circumference - percent / 100 * circumference;
    ring.style.strokeDashoffset = offset;
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    } catch(e){}
  }

  function updateUI() {
    const statusText = document.getElementById("status-text");
    const exName = document.getElementById("exercise-name");
    const infoBox = document.getElementById("info-box");
    const infoTarget = document.getElementById("info-target");
    const infoDetail = document.getElementById("info-detail");
    const infoReps = document.getElementById("info-reps");
    const timerDisplay = document.getElementById("timer");
    const btn = document.getElementById("action-btn");
    const progressText = document.getElementById("progress-text");
    const setBadge = document.getElementById("set-badge");
    const repTracker = document.getElementById("rep-tracker");

    if (currentIndex === -1) {
      setBadge.style.display = "none";
      infoBox.style.display = "none";
      repTracker.style.display = "none";
      statusText.innerText = "ANTRENMANA HAZIRLAN";
      statusText.style.color = "#888";
      exName.innerText = "Full Body Hipertrofi";
      timerDisplay.innerText = "00:00";
      setRingProgress(100);
      ring.setAttribute("stroke", "#00f2fe");
      btn.innerText = "ANTRENMANA BAŞLA";
      progressText.innerText = "0 / " + workout.length + " Egzersiz";
      return;
    }

    if (currentIndex >= workout.length) {
      setBadge.style.display = "none";
      infoBox.style.display = "none";
      repTracker.style.display = "none";
      statusText.innerText = "TEBRİKLER!";
      statusText.style.color = "#00f2fe";
      exName.innerText = "Antrenman Bitti";
      timerDisplay.innerText = "00:00";
      setRingProgress(100);
      ring.setAttribute("stroke", "#00f2fe");
      btn.innerText = "YENİDEN BAŞLAT";
      progressText.innerText = workout.length + " / " + workout.length + " Egzersiz";
      triggerSealQuote();
      return;
    }

    const current = workout[currentIndex];
    progressText.innerText = (currentIndex + 1) + " / " + workout.length + " Egzersiz";
    setBadge.style.display = "inline-block";
    setBadge.innerText = currentSet + ". SET / " + current.sets + " SET";

    if (isResting) {
      infoBox.style.display = "none";
      repTracker.style.display = "none";

      if (currentSet >= current.sets) {
        statusText.innerText = "HAREKETLER ARASI GEÇİŞ";
        statusText.style.color = "#ff4757";
        ring.setAttribute("stroke", "#ff4757");
        let nextEx = workout[currentIndex + 1];
        exName.innerText = "Sıradaki: " + (nextEx ? nextEx.name : "Bitiş");
      } else {
        statusText.innerText = "SET ARASI DİNLENME";
        statusText.style.color = "#ffa502";
        ring.setAttribute("stroke", "#ffa502");
        exName.innerText = current.name;
      }
      btn.innerText = "DİNLENMEYİ GEÇ";
    } else {
      infoBox.style.display = "block";
      infoTarget.innerText = "🎯 HEDEF KAS: " + current.target;
      infoDetail.innerText = current.detail;
      infoReps.innerText = "🎯 Hedef: " + current.targetReps;

      statusText.innerText = "EGZERSİZ ZAMANI";
      statusText.style.color = "#2ed573";
      ring.setAttribute("stroke", "#2ed573");
      exName.innerText = current.name;

      if (current.type === "reps") {
        repTracker.style.display = "block";
        timerDisplay.innerText = "--:--";
        setRingProgress(100);
        btn.innerText = "SETİ TAMAMLADIM";
      } else {
        repTracker.style.display = "none";
        if(!isTimeRunning) {
           formatTimeToDisplay(current.duration);
           setRingProgress(100);
           btn.innerText = "SÜREYİ BAŞLAT";
        }
      }
    }
  }

  function nextStep() {
    clearInterval(timerInterval);
    triggerSealQuote(); // Her aşamada fok balığı yeni bir laf söylesin

    if (currentIndex === -1 || currentIndex >= workout.length) {
      currentIndex = 0;
      currentSet = 1;
      isResting = false;
      isTimeRunning = false;
      updateUI();
      return;
    }

    if (!isResting) {
      const current = workout[currentIndex];
      
      if (current.type === "reps") {
        const val = document.getElementById("rep-input").value;
        if(val) {
          localStorage.setItem(`ex_${currentIndex}_set_${currentSet}`, val);
          document.getElementById("rep-input").value = "";
        }
      }

      if (current.type === "time" && !isTimeRunning) {
        isTimeRunning = true;
        document.getElementById("action-btn").innerText = "SÜREYİ GEÇ";
        startTimer(current.duration);
        return;
      }

      isTimeRunning = false;
      isResting = true;
      
      if (currentIndex === workout.length - 1 && currentSet >= current.sets) {
        currentIndex++;
        isResting = false;
        updateUI();
        return;
      }

      let restTime = (currentSet >= current.sets) ? current.exRest : current.setRest;
      updateUI();
      startTimer(restTime);
    } else {
      isResting = false;
      if (currentSet >= workout[currentIndex].sets) {
        currentSet = 1;
        currentIndex++;
      } else {
        currentSet++;
      }
      updateUI();
    }
  }

  function startTimer(seconds) {
    clearInterval(timerInterval);
    totalSeconds = seconds;
    secondsLeft = seconds;
    formatTimeToDisplay(secondsLeft);
    setRingProgress(100);

    timerInterval = setInterval(() => {
      secondsLeft--;
      formatTimeToDisplay(secondsLeft);
      
      let percent = (secondsLeft / totalSeconds) * 100;
      setRingProgress(percent);

      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        playBeep();
        nextStep();
      }
    }, 1000);
  }

  function formatTimeToDisplay(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    document.getElementById("timer").innerText = `${m}:${s}`;
  }

  updateUI();
</script>

</body>
</html>
