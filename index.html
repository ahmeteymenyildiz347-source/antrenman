<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antrenman Koçu Pro</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: #1e1e1e; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.8); }
    
    /* Video ve GIF Kutusu */
    .media-container { width: 100%; height: 220px; margin-bottom: 15px; border-radius: 12px; overflow: hidden; display: none; background: #2a2a2a; position: relative; }
    .media-container img, .media-container video { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }

    h1 { margin-top: 0; color: #4facfe; font-size: 24px; margin-bottom: 15px; font-weight: 800; letter-spacing: -0.5px; }
    .status { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; font-weight: bold; color: #888; }
    .set-badge { display: inline-block; background: rgba(0, 242, 254, 0.15); color: #00f2fe; padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
    .exercise-name { font-size: 24px; font-weight: bold; margin-bottom: 8px; min-height: 30px; color: #fff; }
    .detail { font-size: 15px; color: #aaa; margin-bottom: 20px; line-height: 1.4; }
    
    /* Dairesel Sayaç */
    .ring-container { position: relative; width: 160px; height: 160px; margin: 0 auto 25px auto; }
    .progress-ring__circle { transition: stroke-dashoffset 1s linear; transform: rotate(-90deg); transform-origin: 50% 50%; }
    .timer-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; font-weight: bold; color: #fff; }

    .btn { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: #000; border: none; padding: 16px 28px; font-size: 18px; font-weight: 800; border-radius: 14px; cursor: pointer; width: 100%; transition: transform 0.1s, opacity 0.2s; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .progress { margin-top: 20px; font-size: 14px; color: #777; font-weight: 500; }
  </style>
</head>
<body>

<div class="card">
  <h1>🔥 FULL BODY PRO</h1>
  
  <div class="media-container" id="media-container">
    <video id="exercise-video" autoplay loop muted playsinline style="display:none;"></video>
    <img id="exercise-img" src="" alt="Egzersiz" style="display:none;">
  </div>

  <div class="status" id="status-text">ANTRENMANA HAZIRLAN</div>
  <div class="set-badge" id="set-badge" style="display:none;"></div>
  
  <div class="exercise-name" id="exercise-name">Vücut Ağırlığı Rutini</div>
  <div class="detail" id="exercise-detail">Kas Gelişimi İçin Optimal Dinlenme</div>

  <div class="ring-container" id="ring-container">
    <svg class="progress-ring" width="160" height="160">
      <circle stroke="#2a2a2a" stroke-width="8" fill="transparent" r="70" cx="80" cy="80"/>
      <circle id="ring-path" class="progress-ring__circle" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" fill="transparent" r="70" cx="80" cy="80"/>
    </svg>
    <div class="timer-display" id="timer">00:00</div>
  </div>

  <button class="btn" id="action-btn" onclick="nextStep()">BAŞLA</button>
  <div class="progress" id="progress-text">0 / 5 Egzersiz</div>
</div>

<script>
  // Tam ve Bilimsel Full Body Antrenmanı (Calisthenics)
  const workout = [
    { 
      name: "1. Pike Push-Up", 
      type: "reps", 
      sets: 3, 
      detail: "Omuz ve Üst Göğüs.\nHedef: 8-12 Tekrar.", 
      setRest: 90, 
      exRest: 120, 
      media: "https://upload.wikimedia.org/wikipedia/commons/7/7b/Pike_push_up.gif" 
    },
    { 
      name: "2. Barfiks (veya Inverted Row)", 
      type: "reps", 
      sets: 3, 
      detail: "Sırt ve Biceps.\nHedef: Tükenişe Yakın.", 
      setRest: 90, 
      exRest: 120, 
      media: "https://upload.wikimedia.org/wikipedia/commons/e/e2/Pullup.gif" 
    },
    { 
      name: "3. Standart Şınav", 
      type: "reps", 
      sets: 4, 
      detail: "Göğüs ve Triceps.\nHedef: Formu bozmadan tükeniş.", 
      setRest: 90, 
      exRest: 120, 
      media: "https://upload.wikimedia.org/wikipedia/commons/b/b8/Pushups.gif" 
    },
    { 
      name: "4. Bulgarian Split Squat", 
      type: "reps", 
      sets: 3, 
      detail: "Ön Bacak ve Kalça.\nHedef: Her bacak için 10-15 Tekrar.", 
      setRest: 90, 
      exRest: 120, 
      media: "https://upload.wikimedia.org/wikipedia/commons/4/4b/Bulgarian_Split_Squat.gif" 
    },
    { 
      name: "5. Hollow Body (veya Plank)", 
      type: "time", 
      duration: 60, 
      sets: 3, 
      detail: "Merkez Bölge (Core).\nHedef: 60 saniye boyunca kasılı kal.", 
      setRest: 60, 
      exRest: 0, 
      media: "https://upload.wikimedia.org/wikipedia/commons/2/23/Plank_exercise.gif" 
    }
  ];

  let currentIndex = -1;
  let currentSet = 1;
  let isResting = false;
  let isTimeRunning = false;
  let timerInterval = null;
  let secondsLeft = 0;
  let totalSeconds = 0;

  const ring = document.getElementById('ring-path');
  const radius = ring.r.baseVal.value;
  const circumference = radius * 2 * Math.PI;
  ring.style.strokeDasharray = `${circumference} ${circumference}`;
  ring.style.strokeDashoffset = circumference;

  function setRingProgress(percent) {
    const offset = circumference - percent / 100 * circumference;
    ring.style.strokeDashoffset = offset;
  }

  // Medyayı sorunsuz oynatmak için geliştirilmiş fonksiyon
  function renderMedia(mediaUrl) {
    const videoEl = document.getElementById("exercise-video");
    const imgEl = document.getElementById("exercise-img");
    
    if (!mediaUrl) {
      videoEl.style.display = "none";
      imgEl.style.display = "none";
      videoEl.pause();
      return;
    }

    if (mediaUrl.endsWith(".mp4")) {
      imgEl.style.display = "none";
      videoEl.style.display = "block";
      if (videoEl.src !== mediaUrl) {
        videoEl.src = mediaUrl;
        videoEl.play().catch(e => console.log("Otomatik oynatma bekliyor."));
      }
    } else {
      videoEl.style.display = "none";
      videoEl.pause();
      imgEl.style.display = "block";
      if (imgEl.src !== mediaUrl) {
        imgEl.src = mediaUrl;
      }
    }
  }

  function updateUI() {
    const statusText = document.getElementById("status-text");
    const exName = document.getElementById("exercise-name");
    const exDetail = document.getElementById("exercise-detail");
    const timerDisplay = document.getElementById("timer");
    const btn = document.getElementById("action-btn");
    const progressText = document.getElementById("progress-text");
    const setBadge = document.getElementById("set-badge");
    const mediaContainer = document.getElementById("media-container");

    if (currentIndex === -1) {
      setBadge.style.display = "none";
      mediaContainer.style.display = "none";
      statusText.innerText = "ANTRENMANA HAZIRLAN";
      statusText.style.color = "#888";
      exName.innerText = "Vücut Ağırlığı Rutini";
      exDetail.innerText = "Tüm kas gruplarını çalıştıran sistem.";
      timerDisplay.innerText = "00:00";
      setRingProgress(100);
      ring.setAttribute("stroke", "#00f2fe");
      btn.innerText = "ANTRENMANA BAŞLA";
      progressText.innerText = "0 / " + workout.length + " Egzersiz";
      return;
    }

    if (currentIndex >= workout.length) {
      setBadge.style.display = "none";
      mediaContainer.style.display = "none";
      renderMedia(""); 
      statusText.innerText = "TEBRİKLER!";
      statusText.style.color = "#00f2fe";
      exName.innerText = "Antrenman Bitti";
      exDetail.innerText = "Kaslar uyarıldı, şimdi protein ve dinlenme vakti!";
      timerDisplay.innerText = "00:00";
      setRingProgress(100);
      ring.setAttribute("stroke", "#00f2fe");
      btn.innerText = "YENİDEN BAŞLAT";
      progressText.innerText = workout.length + " / " + workout.length + " Egzersiz";
      return;
    }

    const current = workout[currentIndex];
    progressText.innerText = (currentIndex + 1) + " / " + workout.length + " Egzersiz";
    setBadge.style.display = "inline-block";
    setBadge.innerText = currentSet + ". SET / " + current.sets;

    if (isResting) {
      mediaContainer.style.display = "none"; 
      renderMedia(""); 

      if (currentSet >= current.sets) {
        statusText.innerText = "HAREKETLER ARASI GEÇİŞ";
        statusText.style.color = "#ff4757";
        ring.setAttribute("stroke", "#ff4757");
        let nextEx = workout[currentIndex + 1];
        exName.innerText = "Sıradaki: " + (nextEx ? nextEx.name : "Bitiş");
        exDetail.innerText = "2 dakika dinlen. Nabzını düşür ve diğer kasa odaklan.";
      } else {
        statusText.innerText = "SET ARASI DİNLENME";
        statusText.style.color = "#ffa502";
        ring.setAttribute("stroke", "#ffa502");
        exName.innerText = current.name;
        exDetail.innerText = "Kaslarındaki ATP depoları doluyor. Bekle. (90 sn)";
      }
      btn.innerText = "DİNLENMEYİ GEÇ";
    } else {
      mediaContainer.style.display = "block";
      renderMedia(current.media);
      
      statusText.innerText = "EGZERSİZ ZAMANI";
      statusText.style.color = "#2ed573";
      ring.setAttribute("stroke", "#2ed573");
      exName.innerText = current.name;
      exDetail.innerText = current.detail;

      if (current.type === "reps") {
        timerDisplay.innerText = "--:--";
        setRingProgress(100);
        btn.innerText = "SETİ TAMAMLADIM";
      } else {
        if(!isTimeRunning) {
           formatTimeToDisplay(current.duration);
           setRingProgress(100);
           btn.innerText = "SÜREYİ BAŞLAT";
        }
      }
    }
  }

  function nextStep() {
    clearInterval(timerInterval);

    if (currentIndex === -1 || currentIndex >= workout.length) {
      currentIndex = 0;
      currentSet = 1;
      isResting = false;
      isTimeRunning = false;
      updateUI();
      return;
    }

    if (!isResting) {
      const current = workout[currentIndex];
      
      if (current.type === "time" && !isTimeRunning) {
        isTimeRunning = true;
        document.getElementById("action-btn").innerText = "SÜREYİ GEÇ";
        startTimer(current.duration);
        return;
      }

      isTimeRunning = false;
      isResting = true;
      
      if (currentIndex === workout.length - 1 && currentSet >= current.sets) {
        currentIndex++;
        isResting = false;
        updateUI();
        return;
      }

      let restTime = (currentSet >= current.sets) ? current.exRest : current.setRest;
      updateUI();
      startTimer(restTime);
    } else {
      isResting = false;
      if (currentSet >= workout[currentIndex].sets) {
        currentSet = 1;
        currentIndex++;
      } else {
        currentSet++;
      }
      updateUI();
    }
  }

  function startTimer(seconds) {
    clearInterval(timerInterval);
    totalSeconds = seconds;
    secondsLeft = seconds;
    formatTimeToDisplay(secondsLeft);
    setRingProgress(100);

    timerInterval = setInterval(() => {
      secondsLeft--;
      formatTimeToDisplay(secondsLeft);
      
      let percent = (secondsLeft / totalSeconds) * 100;
      setRingProgress(percent);

      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        nextStep();
      }
    }, 1000);
  }

  function formatTimeToDisplay(sec) {
    const m = Math.floor(sec / 60).toString().padStart(2, '0');
    const s = (sec % 60).toString().padStart(2, '0');
    document.getElementById("timer").innerText = `${m}:${s}`;
  }

  updateUI();
</script>

</body>
</html>
